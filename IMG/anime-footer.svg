<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 120" width="100%" height="120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B33" />
      <stop offset="100%" stop-color="#1E1832" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#BB9AF7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#7AA2F7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0.16" />
    </linearGradient>
    <linearGradient id="accentStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#BB9AF7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.45" />
    </linearGradient>
    <clipPath id="roundedClip">
      <rect x="1" y="1" width="1278" height="118" rx="16" />
    </clipPath>
    <style>
      .twinkle1 { animation: pulse 3.6s ease-in-out infinite; }
      .twinkle2 { animation: pulse 4.8s ease-in-out infinite 1.2s; }
      .twinkle3 { animation: pulse 4.1s ease-in-out infinite 2.1s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }
      .jp-quote {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 2.5px;
        fill: #E6EDF3;
      }
      .en-quote {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0.8px;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <g clip-path="url(#roundedClip)">
    <rect width="1280" height="120" fill="url(#bgGrad)" />

    <!-- Soft twilight waves -->
    <path d="M0 78 C240 42, 420 105, 680 72 C920 42, 1090 95, 1280 64 L1280 120 L0 120 Z" fill="url(#wave1)" />
    <path d="M0 92 C280 66, 500 112, 760 86 C1000 62, 1140 102, 1280 82 L1280 120 L0 120 Z" fill="url(#wave2)" />

    <!-- Starlight dots & subtle sakura petals -->
    <circle cx="96" cy="28" r="1.6" fill="#7AA2F7" class="twinkle1" />
    <circle cx="188" cy="44" r="1.2" fill="#E6EDF3" class="twinkle2" />
    <circle cx="290" cy="22" r="1.8" fill="#BB9AF7" class="twinkle3" />
    <circle cx="990" cy="26" r="1.6" fill="#F472B6" class="twinkle2" />
    <circle cx="1105" cy="42" r="1.3" fill="#7AA2F7" class="twinkle1" />
    <circle cx="1192" cy="24" r="1.8" fill="#E6EDF3" class="twinkle3" />
    <ellipse cx="148" cy="64" rx="4.5" ry="2.2" transform="rotate(-24 148 64)" fill="#F472B6" opacity="0.55" />
    <ellipse cx="1140" cy="68" rx="4.5" ry="2.2" transform="rotate(20 1140 68)" fill="#F472B6" opacity="0.55" />
    <ellipse cx="1045" cy="84" rx="3.5" ry="1.8" transform="rotate(-15 1045 84)" fill="#BB9AF7" opacity="0.45" />

    <!-- Centered quote -->
    <text x="640" y="50" text-anchor="middle" class="jp-quote">「 自分を愛し、学び続けよう 」</text>
    <text x="640" y="76" text-anchor="middle" class="en-quote">Love yourself and never stop learning · Crafted by Aditya Anugrah (@Ditnzyyyvv)</text>
  </g>

  <rect x="1" y="1" width="1278" height="118" rx="16" stroke="url(#accentStroke)" stroke-width="1.2" />
</svg>
